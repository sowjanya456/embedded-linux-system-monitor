# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "own-meta-mylayer"
BBFILE_PATTERN_own-meta-mylayer = "^${LAYERDIR}/"
BBFILE_PRIORITY_own-meta-mylayer = "6"

LAYERDEPENDS_own-meta-mylayer = "core"
LAYERSERIES_COMPAT_own-meta-mylayer = "scarthgap"
